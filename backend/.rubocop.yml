require:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - "db/schema.rb"
    - "bin/**/*"
    - "vendor/**/*"

Style/Documentation:
  Enabled: false

# Migrations geram métodos longos por natureza (criação do schema inicial).
Metrics/AbcSize:
  Exclude:
    - "db/migrate/*"

Metrics/MethodLength:
  Exclude:
    - "db/migrate/*"

# `abort` no rails_helper é o boilerplate padrão do rspec-rails.
Rails/Exit:
  Exclude:
    - "spec/rails_helper.rb"

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

RSpec/ContextWording:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 3

RSpec/ExampleLength:
  Max: 10
