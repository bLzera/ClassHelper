name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3"
          bundler-cache: true
          working-directory: backend
      - name: RuboCop
        run: bundle exec rubocop --parallel

  test:
    name: Test (RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: classhelper
          POSTGRES_PASSWORD: classhelpertest
          POSTGRES_DB: classhelper_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://classhelper:classhelpertest@localhost:5432/classhelper_test
      SECRET_KEY_BASE: ci-secret-key-base-64chars-minimum-placeholder-padding-padding1
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:3000/auth/callback
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3"
          bundler-cache: true
          working-directory: backend
      - name: Run migrations
        run: bundle exec rails db:migrate
      - name: Run tests
        run: bundle exec rspec --format documentation
